<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0c1830"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#4de8ff"/>
      <stop offset="75%" stop-color="#4de8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Contenu resserré dans la zone sûre (~80% du centre) pour l'icône maskable -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#4de8ff" stroke-width="12" opacity="0.7" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="58" fill="url(#core)" filter="url(#glow)"/>
</svg>
